<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Search Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .result-frame {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            background-color: #fff;
            border-radius: 5px;
        }

        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .result-link {
            color: #0073b1;
            text-decoration: none;
        }

        .result-link:hover {
            text-decoration: underline;
        }

        .search-url {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LinkedIn Job Search Results</h1>

        {% if results %}
            {% for result in results %}
                <div class="result-frame">
                    <div class="result-title">
                        {{ result|safe }}  <!-- Ensure HTML is rendered inside the result -->
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <p>No results found.</p>
        {% endif %}
    </div>
</body>
</html>
