{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Search Results</title>
    <link rel="stylesheet" href="{% static 'fenjan/search_results.css' %}">
</head>
<body>
    <a href="{% url 'index' %}" class="home-icon">
        <img src="{% static 'fenjan/src/home-icon.png' %}" alt="Home" class="home-img">
    </a>

    <div class="container">
        <h1>LinkedIn Job Search Results for {{ customer }}</h1>

        {% if html_content %}
            <ul class="results-list">
                {% for item in html_content %}
                    <li class="result-item">{{ item|safe }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="no-results">No results found.</p>
        {% endif %}
    </div>

    <script src="{% static 'fenjan/index.js' %}"></script>
</body>
</html>
