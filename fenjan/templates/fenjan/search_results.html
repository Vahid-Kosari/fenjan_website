{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Search Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .result-frame {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            background-color: #fff;
            border-radius: 5px;
        }

        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .result-link {
            color: #0073b1;
            text-decoration: none;
        }

        .result-link:hover {
            text-decoration: underline;
        }

        .search-url {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }

        .home-img {
            width: 40px;
            height: auto;
        }

        .home-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <a href="{% url 'index' %}" class="home-icon">
        <img src="{% static 'fenjan/src/home-icon.png' %}" alt="Home" class="home-img">
    </a>
        <div class="container">
        <h1>LinkedIn Job Search Results for {{ customer }}</h1>

        {% if html_content %}
            <ul>
                {% for item in html_content %}
                    <li>{{ item|safe }}</li>  {# Use |safe if HTML content should be rendered as HTML #}
                {% endfor %}
            </ul>
        {% else %}
            <p>No results found.</p>
        {% endif %}

    </div>
</body>
</html>
