<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&title_place_holder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            padding: 20px;
        }
        .header img {
            max-width: 150px;
        }
        .greeting {
            text-align: center;
            margin: 20px 0;
        }
        .greeting img {
            max-width: 300px;
        }
        .content {
            padding: 20px;
        }
        .positions {
            margin-top: 20px;
        }
        .position {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 5px solid #52a150;
        }
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with Logo -->
        <div class="header">
            <img src="&header_logo_place_holder" alt="Logo">
        </div>

        <!-- Greeting Section -->
        <div class="greeting">
            <img src="&greeting_image_place_holder" alt="Greeting Image">
            <p>&greeting_place_holder</p>
        </div>

        <!-- Positions Content -->
        <div class="content">
            <h2>Latest Opportunities</h2>
            <div class="positions">
                &position_template_place_holder
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            &footer_place_holder
        </div>
    </div>

</body>
</html>
