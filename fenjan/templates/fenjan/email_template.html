{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <title>&title_place_holder</title>
</head>
<body>

    <div class="container">
        <!-- Header with Logo -->
        <div class="header">
            <img src="&header_logo_place_holder" alt="Logo">

        <div class="greeting">
            <img src="&greeting_image_place_holder" alt="Greeting Image">

    </div>
</body>
</html>
